<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}管理後台{% endblock %} · Card Tracker</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='theme.css') }}"></head><body>{% include '_nav.html' %}<div class="admin-shell"><aside class="admin-sidebar"><span class="eyebrow">WORKSPACE</span><h2>內容管理</h2><p>管理前台看得見的內容</p><nav aria-label="後台功能"><a href="{{ url_for('collectors.manage') }}" {% if request.endpoint in ['collectors.manage','collectors.edit'] %}aria-current="page"{% endif %}>收藏卡研究資料 <span>↗</span></a><a href="{{ url_for('dorasuta.manage') }}" {% if request.endpoint=='dorasuta.manage' %}aria-current="page"{% endif %}>Dorasuta 報價匯入 <span>↗</span></a><a href="{{ url_for('catalog.media',scope='dorasuta') }}" {% if request.endpoint=='catalog.media' and scope=='dorasuta' %}aria-current="page"{% endif %}>Dorasuta 卡圖 <span>↗</span></a><a href="{{ url_for('admin_dashboard') }}" {% if request.endpoint=='admin_dashboard' %}aria-current="page"{% endif %}>概覽與資料更新 <span>↗</span></a><a href="{{ url_for('catalog.manage_catalog') }}" {% if request.endpoint in ['catalog.manage_catalog','catalog.edit_catalog'] %}aria-current="page"{% endif %}>圖鑑與效果 <span>↗</span></a><a href="{{ url_for('catalog.media',scope='catalog') }}" {% if request.endpoint=='catalog.media' and scope=='catalog' %}aria-current="page"{% endif %}>圖鑑卡圖 <span>↗</span></a><a href="{{ url_for('catalog.media',scope='yuyu') }}" {% if request.endpoint=='catalog.media' and scope=='yuyu' %}aria-current="page"{% endif %}>悠悠亭卡圖 <span>↗</span></a></nav><div class="sidebar-bottom"><a href="{{ url_for('home') }}">查看前台圖鑑 →</a><a href="{{ url_for('yuyutei.prices') }}">查看店家行情 →</a><a href="{{ url_for('buyback.offers') }}">查看收購價 →</a><a href="{{ url_for('recommendations.cards') }}">查看推薦卡片 →</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary-btn">登出後台</button></form></div></aside><main id="page-content" class="admin-content">{% for category,message in get_flashed_messages(with_categories=true) %}<p role="status" class="yuyu-message {{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></div><script>document.querySelectorAll('form[data-loading]').forEach(form=>form.addEventListener('submit',()=>{const b=form.querySelector('button[type=submit]');if(b){b.disabled=true;b.textContent='更新中…';}}));window.addEventListener('pageshow',()=>document.querySelectorAll('form[data-loading] button').forEach(b=>{b.disabled=false;b.textContent=b.dataset.label||'更新';}));</script></body></html>
