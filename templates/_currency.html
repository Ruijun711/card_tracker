<section class="currency-panel" aria-labelledby="currency-heading"><div><h2 id="currency-heading">台幣價格換算</h2><p>日幣價格 ÷ x = 台幣參考價</p></div><div class="currency-controls"><label for="currency-divisor">換算除數 x</label><input id="currency-divisor" type="number" inputmode="decimal" step="any" placeholder="例如：5" aria-describedby="currency-help currency-message"><button type="button" id="currency-clear" class="secondary-btn">清除</button></div><p id="currency-help" class="chart-note">輸入大於 0 的數字，即時換算並無條件捨去小數，只顯示整數。此為自訂換算，非即時匯率；瀏覽器會記住你的設定。</p><p id="currency-message" role="status" aria-live="polite">輸入 x 後顯示台幣參考價。</p></section>
